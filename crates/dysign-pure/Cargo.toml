[package]
name = "dysign-pure"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
