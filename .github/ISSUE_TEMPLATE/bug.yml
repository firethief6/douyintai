name: 问题报告
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先搜索现有 Issue。安全问题请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台
      placeholder: Linux 24.04 / macOS 15 arm64 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 贴关键日志，不要贴完整设备身份池。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 截图、录屏、构建方式等。
