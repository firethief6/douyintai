[package]
name = "dycore"
version = "0.1.0"
edition = "2021"

[dependencies]
dysign-pure = { path = "../dysign-pure" }
dysign = { path = "../dysign" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
rand = "0.8"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
flate2 = "1"
