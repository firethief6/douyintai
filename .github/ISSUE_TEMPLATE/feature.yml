name: 功能建议
description: 提出新能力或交互改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: runtime
    attributes:
      label: 是否引入外部运行时
      options:
        - 不引入
        - 需要 Python
        - 需要 Node
        - 需要 Java
        - 需要 ffmpeg
        - 不确定
