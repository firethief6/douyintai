[package]
name = "douyintai"
version = "0.1.0"
description = "Douyin desktop workbench"
authors = ["FireThief"]
edition = "2021"
rust-version = "1.77.2"
default-run = "douyintai"

[lib]
name = "douyintai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking", "socks"] }
tokio = { version = "1", features = ["fs", "time", "rt", "macros"] }
futures-util = "0.3"
dycore = { path = "../crates/dycore" }
dysign = { path = "../crates/dysign" }

url = "2"
aes = "0.8"
ctr = "0.9"
md-5 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
trash = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[[bin]]
name = "douyintai"
path = "src/main.rs"

[[bin]]
name = "desktop-serve"
path = "src/bin/serve.rs"
